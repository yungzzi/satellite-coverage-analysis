services:
  satellite-api:
    image: satellite-coverage-api:dev
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SAT_API_TOKEN: ${SAT_API_TOKEN:-}
      SAT_CORS_ORIGINS: ${SAT_CORS_ORIGINS:-}
      SAT_JOB_TIMEOUT_S: ${SAT_JOB_TIMEOUT_S:-900}
    volumes:
      - satellite-results:/var/lib/satellite-coverage
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
volumes:
  satellite-results:
