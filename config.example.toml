# ============================================================
# 卫星覆盖性分析 —— 配置文件模板（TOML）
# 用法：复制本文件为 config.toml（config.toml 不入库），然后：
#   .venv\Scripts\python src\coverage_analysis.py --config config.toml
# 优先级：命令行参数 > 配置文件 > 代码里的默认值。
# 不填的项保持默认；# 开头是注释，随便写。
# ============================================================

# ---------- 目标区域 ----------
# polygon = 多边形地区（用下面的 GeoJSON）；circle = 点+半径（用下面的圆心/半径）
region_mode = "polygon"
region_geojson = "data/geo/330000.json"   # polygon 模式：地区边界文件
# circle 模式：圆心经纬度 + 半径（公里）
target_lat = 30.25
target_lon = 120.15
target_radius_km = 5.0

# ---------- 分析时段（UTC，北京时间 = UTC+8） ----------
start_utc = "2026-08-03 00:00:00"
end_utc = "2026-08-03 08:00:00"
step_minutes = 1

# ---------- 传感器参数（全局默认） ----------
# 逐星覆盖：见 data/sensor_params.toml（只按 NORAD 匹配；未设置用这里的默认值；
#            GUI ⑤页可编辑，CLI 可用 --sensor-params 指定其他表）
fov_half_angle_deg = 10.0    # 视场半角（度）：视线张角/天底圆锥半角（假设值，Q147）
min_elevation_deg = 10.0      # 最小仰角（度）
swath_km_global = 60.0        # 全局幅宽（km）：仅"幅宽生效"开启（sensor_params.toml 的
                              # swath_enabled=true）时替代视场半角，作为普通卫星足印口径

# ---------- 网格（仅 polygon 模式用） ----------
grid_spacing_deg = 0.2

# ---------- 输出 ----------
save_plots = false            # 图（可用卫星数曲线+甘特图）默认不生成；需要演示图时改 true
save_gantt = false            # 甘特图（仅在 save_plots=true 时生效）
max_gantt_rows = 15           # 甘特图最多画几颗星
