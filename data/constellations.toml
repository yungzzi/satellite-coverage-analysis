# ============================================================
# 星座目录（④页"星座导入"用，入库，可随软件更新）
#
# source.type 两种：
#   celestrak_group = CelesTrak 整组下载（gp.php?GROUP=...），一个请求一整组
#   name_filter     = 名字规则（按关键字匹配全集在轨载荷，新发射自动纳入）
# purpose 用途分类：遥感 / 通信（含互联网） / 导航 / 其他
# ============================================================

[[constellations]]
name = "星链 Starlink"
purpose = "通信（含互联网）"
source = { type = "celestrak_group", value = "starlink" }
description = "SpaceX 低轨宽带互联网星座，现役最大的星座（1 万余颗）"

