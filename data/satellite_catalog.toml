# ============================================================
# 内置星座目录（随软件发布，只读）
# 内置夹只读；想有自己的版本，请新建收藏夹后手动加入相同的名字规则或编号。
# 新星座主要通过"搜索 -> 加入收藏"解决，不需要改本文件。
#
# 条目类型：
#   name_filter = 名字规则（活的：更新 TLE 时自动纳入新发射的同名卫星）
#   norad_list  = 编号清单（固定：只包含列出的编号）
#   file        = 导入文件（不用于内置目录）
# ============================================================

[[collections]]
name = "中国遥感系列（示例）"
description = "遥感卫星家族（名字规则，自动纳入新星；数据来自 CelesTrak 编目）"
entries = [
  { type = "name_filter", value = "YAOGAN" },
]

[[collections]]
name = "国际知名星座（示例）"
description = "演示 CelesTrak 星座分组：一键导入整星座"
entries = [
  { type = "name_filter", value = "STARLINK" },
  { type = "name_filter", value = "ONEWEB" },
]

[[collections]]
name = "吉林一号全量（测试 58 颗）"
description = "长光吉林一号全部可得卫星（快照 2026-08-06，含未命名星）；数据来自 data/test_data/jilin1_all.tle"
entries = [
  { type = "file", value = "data/test_data/jilin1_all.tle" },
]

[[collections]]
name = "中国遥感全量（测试）"
description = "中国遥感卫星全集快照（测试基准 303 颗：遥感/高分/吉林/天绘/四维高景/海洋/珠海/资源/陆地探测/北京/环境/珞珈等，快照 2026-08-08）；数据来自 data/test_data/china_remote_sensing_all.tle"
entries = [
  { type = "file", value = "data/test_data/china_remote_sensing_all.tle" },
]